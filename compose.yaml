services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: opine
      POSTGRES_PASSWORD: opine
      POSTGRES_DB: opine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U opine -d opine']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data:
